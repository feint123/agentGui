name: Quality Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-smoke:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Run unit and integration smoke
        run: ./scripts/run_quality_smoke.sh unit

      - name: Run UI smoke
        run: ./scripts/run_quality_smoke.sh ui